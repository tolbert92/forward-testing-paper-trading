
name: Skill 7 Contract Validation

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-contracts:
    name: Validate schemas and reference fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Step 2: Configure Python environment
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Step 3: Install testing dependencies
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "jsonschema[format]>=4.23,<5" \
            pytest

      # Step 4: Validate JSON schemas and fixtures
      - name: Validate contracts and fixtures
        run: |
          python -m pytest -v tests/test_contracts.py

      # Step 5: Report successful validation
      - name: Report validation completion
        if: success()
        run: |
          echo "========================================"
          echo "Skill #7 — Contract Validation PASSED"
          echo "========================================"
          echo "JSON schemas validated."
          echo "Reference fixtures validated."
          echo "Contract and accounting tests passed."
          echo "========================================"
